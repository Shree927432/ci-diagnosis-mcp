[project]
name = "ci-diagnosis-mcp"
version = "0.1.0"
description = "MCP server that diagnoses CI failures and returns agent-native, structured logs so coding agents can fix them"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "ci", "github-actions", "diagnosis", "coding-agent"]
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27",
]

[project.scripts]
ci-diagnosis-mcp = "ci_diagnosis_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ci_diagnosis_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"
